services:
  - type: web
    name: webcite
    runtime: python
    repo: https://github.com/YOUR_USERNAME/webcite
    plan: free
    region: oregon
    buildCommand: bash render-build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    domains:
      - pagecite.com
      # ── Advertising config (flip when traffic justifies real networks) ──
      # - key: AD_NETWORK
      #   value: adsense        # adsense | adsterra | aads | none
      # - key: AD_CLIENT
      #   value: ca-pub-XXXXXXXXXXXX
      # - key: AD_SLOT_TOP
      #   value: XXXXXXXXXX
      # - key: AD_SLOT_MID
      #   value: XXXXXXXXXX
