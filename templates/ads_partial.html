{# ads_partial.html — ad slots + lazy-loading JS. Include via {% include 'ads_partial.html' %} #}
{% if ads_on %}
<style>
    /* Ad slots — minimal footprint, no layout shift */
    .ad-slot { margin: 24px auto; text-align: center; overflow: hidden; border-radius: 8px; }
    .ad-slot-top { max-width: 728px; min-height: 60px; }
    .ad-slot-mid { max-width: 336px; min-height: 200px; }
    .ad-label { font-size: 10px; color: #6e7681; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .ad-placeholder {
        border: 1px dashed #30363d; border-radius: 8px; color: #6e7681;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; min-height: 90px; background: #161b22;
    }
    /* House ads — self-promotion (our real revenue stream: API tier) */
    .house-ad { margin: 20px auto; max-width: 728px; }
    .house-ad-inner {
        background: linear-gradient(135deg, #1a2332 0%, #161b22 100%);
        border: 1px solid #30363d; border-left: 3px solid #58a6ff;
        border-radius: 10px; padding: 14px 18px;
        display: flex; align-items: center; gap: 14px;
    }
    .house-ad[data-slot="mid"] .house-ad-inner { max-width: 100%; }
    .house-ad-icon { font-size: 24px; }
    .house-ad-text { flex: 1; }
    .house-ad-text strong { display: block; color: #f0f6fc; font-size: 14px; margin-bottom: 2px; }
    .house-ad-text span { color: #8b949e; font-size: 12px; line-height: 1.5; }
    .house-ad-cta {
        background: #238636; color: white; text-decoration: none;
        padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
        white-space: nowrap; transition: background 0.2s;
    }
    .house-ad-cta:hover { background: #2ea043; }
    @media (max-width: 600px) {
        .house-ad-inner { flex-direction: column; text-align: center; }
        .house-ad-cta { display: inline-block; margin-top: 6px; }
    }
</style>
{% endif %}

{% if ads_on %}
<!-- Ad slot: TOP -->
<div class="ad-label" id="adLabelTop" style="display:none;">Sponsored</div>
<div id="adContainerTop" style="min-height:60px;">{{ ad_top|safe }}</div>

<!-- Ad slot: MID (only on article pages via ad_mid flag) -->
{% if ad_mid %}
<div class="ad-label" id="adLabelMid" style="display:none;">Sponsored</div>
<div id="adContainerMid" style="min-height:200px;">{{ ad_mid_html|safe }}</div>
{% endif %}
{% endif %}

{% if ads_enabled %}
<script>
/* Lazy-load ads only when scrolled into view — zero initial-page cost */
(function() {
    function isHouse(el) { return el.querySelector('.house-ad'); }
    function observe(containerId, labelId) {
        var c = document.getElementById(containerId);
        if (!c) return;
        var label = document.getElementById(labelId);
        // Show the "Sponsored" label only if a real ad will load
        if (c.querySelector('.adsbygoogle') && label) label.style.display = 'block';
        if (!('IntersectionObserver' in window)) return;
        var io = new IntersectionObserver(function(entries) {
            entries.forEach(function(e) {
                if (e.isIntersecting) {
                    // Activate AdSense slots in view
                    c.querySelectorAll('ins.adsbygoogle').forEach(function(ins) {
                        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(err) {}
                    });
                    io.disconnect();
                }
            });
        }, { rootMargin: '200px' });
        io.observe(c);
    }
    observe('adContainerTop', 'adLabelTop');
    observe('adContainerMid', 'adLabelMid');
})();
</script>
{% endif %}
